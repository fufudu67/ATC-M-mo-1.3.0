<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATC Memo</title>
<style>
:root{--bg:#0d1b2a;color-scheme:dark}
html,body{margin:0;min-height:100%;background:#0d1b2a;color:#e8eef5;font:15px system-ui,'Segoe UI',sans-serif}
#atcHost{padding:10px;box-sizing:border-box}
</style></head>
<body><div id="atcHost"></div>
<script>
(function(){
  var i=document.createElement('script');i.src='i18n.js';
  var go=function(){
    var s=document.createElement('script');s.src='memo-ui.js';
    s.onload=function(){ if(window.__atcMount) window.__atcMount(document.getElementById('atcHost')); };
    document.body.appendChild(s);
  };
  i.onload=go; i.onerror=go;
  document.body.appendChild(i);
})();
</script></body></html>
