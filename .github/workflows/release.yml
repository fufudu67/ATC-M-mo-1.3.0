# Builds ATC-Memo.exe (with the SimConnect helper bundled) and attaches it to a GitHub release
# when you push a tag such as v1.0.0
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: SimConnect helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          python -m pip install pyinstaller SimConnect
          python -m PyInstaller --onefile --distpath vendor --workpath build/tmp --specpath build/tmp simhelper.py
          python -c "import SimConnect,os,shutil; shutil.copy(os.path.join(os.path.dirname(SimConnect.__file__),'SimConnect.dll'),'vendor')"
      - run: npm install
      - run: npm run dist
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/ATC-Memo.exe }
